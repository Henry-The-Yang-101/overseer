[package]
name = "overseer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A live hardware observatory for your terminal"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
tachyonfx = "0.25.2"
nucleo-matcher = "0.3"
sysinfo = "0.40"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
toml = "0.9"
unicode-width = "0.2"
libc = "0.2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
macmon = { version = "0.10", default-features = false }
plist = "1"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
objc = "0.2"

[dev-dependencies]
insta = "1"

[profile.release]
lto = "thin"
strip = true

